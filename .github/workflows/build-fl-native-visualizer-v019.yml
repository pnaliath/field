name: Build Field V0.19 FL Native Measured Response Fixes

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/fl-native-visualizer-v0.19-response-fixes
    paths:
      - experiments/fl-native-visualizer-v019/**
      - experiments/fl-native-visualizer-v018/**
      - experiments/fl-native-visualizer-v017/**
      - experiments/fl-native-visualizer-v016/**
      - experiments/fl-native-visualizer-v015/**
      - experiments/fl-native-visualizer-v014/**
      - experiments/fl-native-visualizer-v013/**
      - experiments/fl-native-visualizer-v012/**
      - experiments/fl-native-visualizer-v011/**
      - experiments/fl-native-visualizer-v010/**
      - experiments/fl-native-visualizer-v009/**
      - experiments/fl-native-visualizer-v008/**
      - experiments/fl-native-visualizer-v007/**
      - experiments/fl-native-visualizer-v006/**
      - experiments/fl-native-visualizer-v005/**
      - experiments/fl-native-visualizer-v004/**
      - .github/workflows/build-fl-native-visualizer-v019.yml

jobs:
  windows-fl-native:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S experiments/fl-native-visualizer-v019 -B build/fl-native-visualizer-v019
          -G "Visual Studio 18 2026" -A x64

      - name: Build native DLL
        run: cmake --build build/fl-native-visualizer-v019 --config Release --target FieldV019MeasuredResponseFixes

      - name: Package
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build/fl-native-visualizer-v019 -Recurse -File -Filter "Field V019 Measured Response Fixes_x64.dll" | Select-Object -First 1
          if (-not $dll) {
            Get-ChildItem -Path build/fl-native-visualizer-v019 -Recurse | Select-Object -First 300 FullName
            throw "Field V0.19 native DLL not found"
          }

          $folder = "package/Field V019 Measured Response Fixes"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item $dll.FullName "$folder/Field V019 Measured Response Fixes_x64.dll"
          Set-Content -Path "$folder/Plugin.nfo" -Value "ps_vendorname=Field" -NoNewline
          Compress-Archive -Path $folder -DestinationPath Field-V0.19-Measured-Response-Fixes-Windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Field-V0.19-Measured-Response-Fixes-Windows-x64
          path: Field-V0.19-Measured-Response-Fixes-Windows-x64.zip
          if-no-files-found: error
