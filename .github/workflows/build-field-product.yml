name: Field FL-native release candidate
on:
  workflow_dispatch:
  push:
    branches: [release/v1.0-product, fix/beta1-product-issues]
    paths: [product/**, LICENSE, .github/workflows/build-field-product.yml]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure FL-native product
        run: cmake -S product -B build/product -G "Visual Studio 17 2022" -A x64 -DFIELD_BUILD_VST3=OFF
      - name: Build native plugin and acceptance tests
        run: cmake --build build/product --config Release --parallel 4
      - name: Core and regression acceptance
        run: ctest --test-dir build/product -C Release --output-on-failure
      - name: Windows UI acceptance
        shell: pwsh
        run: |
          ./build/product/Release/FieldRenderCheck.exe | Tee-Object Field-validation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package native product
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'package/Field 1 Beta', dist -Force | Out-Null
          Copy-Item 'build/product/Release/Field 1 Beta_x64.dll' 'package/Field 1 Beta/'
          Set-Content -Path 'package/Field 1 Beta/Plugin.nfo' -Value 'ps_vendorname=Field'
          Copy-Item product/docs package -Recurse
          Copy-Item LICENSE 'package/FIELD-LICENSE.txt'
          Copy-Item Field-*.png package
          Copy-Item Field-validation.txt package
          Set-Content package/BUILD.txt "Field 1.0.0-rc.1`nFL Studio native x64`nCommit: $env:GITHUB_SHA`nRun: $env:GITHUB_RUN_ID"
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" product/installer/Field.iss'
      - name: Portable ZIP and checksums
        shell: pwsh
        run: |
          $packageRoot = (Resolve-Path package).Path
          $checksums = @(Get-ChildItem package -Recurse -File | Sort-Object FullName | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [IO.Path]::GetRelativePath($packageRoot, $_.FullName).Replace('\', '/')
            "$hash  $relative"
          })
          $checksums | Set-Content package/SHA256SUMS.txt -Encoding utf8
          Compress-Archive -Path package/* -DestinationPath dist/Field-1.0.0-rc.1-FL-Windows-x64.zip
          $releaseChecksums = @(Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          })
          $releaseChecksums | Set-Content dist/SHA256SUMS.txt -Encoding utf8
      - name: Renderer review images
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          foreach ($name in @('Field-full-range.png', 'Field-frequency-zoom.png')) {
            $source = [Drawing.Image]::FromFile((Resolve-Path $name).Path)
            $thumb = New-Object Drawing.Bitmap(960, 608)
            $graphics = [Drawing.Graphics]::FromImage($thumb)
            $graphics.DrawImage($source, 0, 0, 960, 608)
            $memory = New-Object IO.MemoryStream
            $thumb.Save($memory, [Drawing.Imaging.ImageFormat]::Jpeg)
            Write-Output ("FIELD_PREVIEW " + $name + " " + [Convert]::ToBase64String($memory.ToArray()))
            $graphics.Dispose(); $thumb.Dispose(); $source.Dispose(); $memory.Dispose()
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Field-1.0.0-rc.1-FL-Windows-x64
          path: |
            dist/*
            Field-*.png
            Field-validation.txt
            build/product/Testing/Temporary/LastTest.log
          if-no-files-found: error