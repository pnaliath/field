name: Build Field V0.33 FL Native Web Render Parity

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/fl-native-visualizer-v0.33-web-render-parity
    paths:
      - experiments/fl-native-visualizer-v033/**
      - experiments/fl-native-visualizer-v031/**
      - experiments/fl-native-visualizer-v030/**
      - experiments/fl-native-visualizer-v029/**
      - experiments/fl-native-visualizer-v028/**
      - experiments/fl-native-visualizer-v027/**
      - experiments/fl-native-visualizer-v026/**
      - experiments/fl-native-visualizer-v025/**
      - experiments/fl-native-visualizer-v024/**
      - experiments/fl-native-visualizer-v023/**
      - experiments/fl-native-visualizer-v022/**
      - experiments/fl-native-visualizer-v021/**
      - experiments/fl-native-visualizer-v020/**
      - experiments/fl-native-visualizer-v019/**
      - experiments/fl-native-visualizer-v018/**
      - experiments/fl-native-visualizer-v017/**
      - experiments/fl-native-visualizer-v016/**
      - experiments/fl-native-visualizer-v015/**
      - experiments/fl-native-visualizer-v014/**
      - experiments/fl-native-visualizer-v013/**
      - experiments/fl-native-visualizer-v012/**
      - experiments/fl-native-visualizer-v011/**
      - experiments/fl-native-visualizer-v010/**
      - experiments/fl-native-visualizer-v009/**
      - experiments/fl-native-visualizer-v008/**
      - experiments/fl-native-visualizer-v007/**
      - experiments/fl-native-visualizer-v006/**
      - experiments/fl-native-visualizer-v005/**
      - experiments/fl-native-visualizer-v004/**
      - .github/workflows/build-fl-native-visualizer-v033.yml

jobs:
  windows-fl-native:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S experiments/fl-native-visualizer-v033 -B build/fl-native-visualizer-v033
          -G "Visual Studio 18 2026" -A x64
      - name: Build native DLL
        run: cmake --build build/fl-native-visualizer-v033 --config Release --target FieldV033WebRenderParity
      - name: Package
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build/fl-native-visualizer-v033 -Recurse -File -Filter "Field V033 Web Render Parity_x64.dll" | Select-Object -First 1
          if (-not $dll) { throw "Field V0.33 native DLL not found" }
          $folder = "package/Field V033 Web Render Parity"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item $dll.FullName "$folder/Field V033 Web Render Parity_x64.dll"
          Set-Content -Path "$folder/Plugin.nfo" -Value "ps_vendorname=Field" -NoNewline
          Compress-Archive -Path $folder -DestinationPath Field-V0.33-Web-Render-Parity-Windows-x64.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Field-V0.33-Web-Render-Parity-Windows-x64
          path: Field-V0.33-Web-Render-Parity-Windows-x64.zip
          if-no-files-found: error
