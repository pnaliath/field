name: Build Field V0.08 FL Native Sticky FX Visualizer

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/fl-native-visualizer-v0.08
    paths:
      - experiments/fl-native-visualizer-v008/**
      - experiments/fl-native-visualizer-v007/**
      - experiments/fl-native-visualizer-v006/**
      - experiments/fl-native-visualizer-v005/**
      - experiments/fl-native-visualizer-v004/**
      - .github/workflows/build-fl-native-visualizer-v008.yml

jobs:
  windows-fl-native:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S experiments/fl-native-visualizer-v008 -B build/fl-native-visualizer-v008
          -G "Visual Studio 18 2026" -A x64

      - name: Build native DLL
        run: cmake --build build/fl-native-visualizer-v008 --config Release --target FieldV008StickyFxVisualizer

      - name: Package
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build/fl-native-visualizer-v008 -Recurse -File -Filter "Field V008 Sticky FX Visualizer_x64.dll" | Select-Object -First 1
          if (-not $dll) {
            Get-ChildItem -Path build/fl-native-visualizer-v008 -Recurse | Select-Object -First 300 FullName
            throw "Field V0.08 native DLL not found"
          }

          $folder = "package/Field V008 Sticky FX Visualizer"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item $dll.FullName "$folder/Field V008 Sticky FX Visualizer_x64.dll"
          Set-Content -Path "$folder/Plugin.nfo" -Value "ps_vendorname=Field" -NoNewline
          Compress-Archive -Path $folder -DestinationPath Field-V0.08-Sticky-FX-Visualizer-Windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Field-V0.08-Sticky-FX-Visualizer-Windows-x64
          path: Field-V0.08-Sticky-FX-Visualizer-Windows-x64.zip
          if-no-files-found: error
